server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/financial_workflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:financial_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 35MB
      max-request-size: 36MB
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  mapper-locations: classpath:mapper/*.xml
logging:
  level:
    root: WARN
    com.financial: INFO
