name: Project checks
on: [push, pull_request]
jobs:
  image-ocr:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .runtime/bin
          swiftc -O rag/vision_ocr.swift -o .runtime/bin/vision-ocr
          python3 scripts/check-image-ocr.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
  java:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: financial_workflow_test
          MYSQL_USER: financial_app
          MYSQL_PASSWORD: test-app-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_PASSWORD: test-app-password
      DEMO_PASSWORD: test-demo-password
      APP_ROOT: ${{ github.workspace }}
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/financial_workflow_test?allowPublicKeyRetrieval=true&useSSL=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -f backend/pom.xml test
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r rag/requirements.lock
      - run: |
          mkdir -p .runtime
          python -c 'import json; open(".runtime/config.json","w").write(json.dumps({"INTERNAL_TOKEN":"test-only","LLM_BASE_URL":"http://invalid.local/v1","LLM_API_KEY":"test-only","EMBEDDING_MODEL":"test-only"}))'
          python -m pytest rag/tests -q
          PYTHONPATH=evaluation python -m pytest evaluation/tests -q
